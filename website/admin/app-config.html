<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>App Update, Ads & Maintenance - Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="main-content">
    <div class="content-body">
      <h1 style="margin-bottom: 25px;">🚀 App Config, Ads & Maintenance</h1>

      <div class="card">
        <form id="config-form">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
            <div class="form-group">
              <label>Latest Version Code (int)</label>
              <input type="number" id="latest_version_code" required>
            </div>
            <div class="form-group">
              <label>Latest Version Name</label>
              <input type="text" id="latest_version_name" required>
            </div>
            <div class="form-group">
              <label>Min Version Code (force update below)</label>
              <input type="number" id="min_version_code" required>
            </div>
            <div class="form-group">
              <label>APK Size (MB)</label>
              <input type="number" step="0.1" id="apk_size_mb">
            </div>
          </div>

          <!-- Interactive APK Direct File Uploader -->
          <div class="form-group" style="background: rgba(16, 185, 129, 0.08); padding: 16px; border-radius: 12px; border: 1px dashed #10b981; margin: 15px 0;">
            <label style="font-weight: 700; color: #10b981; display: flex; align-items: center; gap: 8px;">
              📦 Upload New APK Release (Auto-Deletes Older Builds)
            </label>
            <input type="file" id="apk_file_input" accept=".apk" style="margin-top: 8px; width: 100%;">
            <div id="upload_status" style="margin-top: 8px; font-size: 0.85rem; color: #94a3b8;">
              Select a .apk file to upload. Older versions in storage will automatically be purged.
            </div>
            <div id="upload_progress_container" style="display: none; margin-top: 10px;">
              <div style="background: #1e293b; border-radius: 6px; overflow: hidden; height: 8px;">
                <div id="upload_progress_bar" style="background: #10b981; width: 0%; height: 100%; transition: width 0.2s;"></div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Active APK Download URL (Direct Link for Website Users)</label>
            <input type="url" id="apk_url" required placeholder="https://.../PowerPulse.apk">
          </div>

          <h3 style="margin-top: 20px;">🤖 Smart Ad System Configuration</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
            <div class="form-group">
                <label>Ad Provider</label>
                <select id="ad_provider">
                    <option value="admob">AdMob</option>
                    <option value="adsterra">Adsterra</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ad Mode</label>
                <select id="ad_mode">
                    <option value="manual">Manual</option>
                    <option value="ai_smart">AI Smart Selection</option>
                </select>
            </div>
            <div class="form-group">
                <label>AdMob App ID</label>
                <input type="text" id="admob_app_id">
            </div>
            <div class="form-group">
                <label>AdMob Banner ID</label>
                <input type="text" id="admob_banner_id">
            </div>
            <div class="form-group">
                <label>AdMob Interstitial ID</label>
                <input type="text" id="admob_interstitial_id">
            </div>
            <div class="form-group">
                <label>Adsterra URL</label>
                <input type="text" id="adsterra_url">
            </div>
          </div>

          <div class="form-group">
            <label>Changelog</label>
            <textarea id="changelog" rows="4"></textarea>
          </div>

          <div style="display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="maintenance_mode" style="width: auto;"> Enable Maintenance Mode
            </label>
          </div>

          <div style="display: flex; gap: 15px; margin-top: 25px;">
            <button type="submit" class="btn">Save App Config</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { initAuthGuard } from './js/auth-guard.js';
    import { initAdminNav } from './js/admin-nav.js';
    import { supabase } from '../js/supabase.js';
    import { showToast } from './js/toast.js';

    await initAuthGuard();
    initAdminNav('app-config');

    const form = document.getElementById('config-form');

    async function loadConfig() {
      const { data, error } = await supabase.from('app_config').select('*').eq('id', 1).maybeSingle();
      if (error || !data) return;

      document.getElementById('latest_version_code').value = data.latest_version_code || '';
      document.getElementById('latest_version_name').value = data.latest_version_name || '';
      document.getElementById('min_version_code').value = data.min_version_code || '';
      document.getElementById('apk_size_mb').value = data.apk_size_mb || '';
      document.getElementById('apk_url').value = data.apk_url || '';
      document.getElementById('ad_provider').value = data.ad_provider || 'admob';
      document.getElementById('ad_mode').value = data.ad_mode || 'manual';
      document.getElementById('admob_app_id').value = data.admob_app_id || '';
      document.getElementById('admob_banner_id').value = data.admob_banner_id || '';
      document.getElementById('admob_interstitial_id').value = data.admob_interstitial_id || '';
      document.getElementById('adsterra_url').value = data.adsterra_url || '';
      document.getElementById('changelog').value = data.changelog || '';
      document.getElementById('maintenance_mode').checked = data.maintenance_mode || false;
    }

    const fileInput = document.getElementById('apk_file_input');
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) {
        const mb = (file.size / (1024 * 1024)).toFixed(1);
        document.getElementById('apk_size_mb').value = mb;
        document.getElementById('upload_status').textContent = `Ready: ${file.name} (${mb} MB)`;
      }
    });

    form.onsubmit = async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('upload_status');
      const progressContainer = document.getElementById('upload_progress_container');
      const progressBar = document.getElementById('upload_progress_bar');
      const submitBtn = form.querySelector('button[type="submit"]');

      let finalApkUrl = document.getElementById('apk_url').value;
      const file = fileInput.files[0];

      try {
        if (file) {
          submitBtn.disabled = true;
          progressContainer.style.display = 'block';
          progressBar.style.width = '20%';
          statusEl.textContent = 'Purging previous APK files from storage bucket...';

          // 1. Automatically delete old APK versions from bucket
          try {
            const { data: existingFiles } = await supabase.storage.from('apk-releases').list('');
            if (existingFiles && existingFiles.length > 0) {
              const fileNames = existingFiles.map(f => f.name);
              await supabase.storage.from('apk-releases').remove(fileNames);
            }
          } catch (cleanErr) {
            console.warn('Storage purge non-fatal notice:', cleanErr);
          }

          progressBar.style.width = '50%';
          statusEl.textContent = 'Uploading new APK release...';

          const vCode = document.getElementById('latest_version_code').value || '1';
          const cleanFileName = `PowerPulse_v${vCode}_${Date.now()}.apk`;

          // 2. Upload new version file
          const { data: uploadData, error: uploadErr } = await supabase.storage
            .from('apk-releases')
            .upload(cleanFileName, file, {
              cacheControl: '3600',
              upsert: true
            });

          if (uploadErr) {
            throw new Error(`APK Upload Error: ${uploadErr.message}`);
          }

          progressBar.style.width = '85%';
          statusEl.textContent = 'Publishing direct download URL...';

          // 3. Obtain public download link
          const { data: publicUrlData } = supabase.storage
            .from('apk-releases')
            .getPublicUrl(cleanFileName);

          if (publicUrlData && publicUrlData.publicUrl) {
            finalApkUrl = publicUrlData.publicUrl;
            document.getElementById('apk_url').value = finalApkUrl;
          }

          progressBar.style.width = '100%';
          statusEl.textContent = 'APK uploaded and previous builds purged successfully!';
        }

        const payload = {
          latest_version_code: Number(document.getElementById('latest_version_code').value),
          latest_version_name: document.getElementById('latest_version_name').value,
          min_version_code: Number(document.getElementById('min_version_code').value),
          apk_size_mb: Number(document.getElementById('apk_size_mb').value),
          apk_url: finalApkUrl,
          ad_provider: document.getElementById('ad_provider').value,
          ad_mode: document.getElementById('ad_mode').value,
          admob_app_id: document.getElementById('admob_app_id').value,
          admob_banner_id: document.getElementById('admob_banner_id').value,
          admob_interstitial_id: document.getElementById('admob_interstitial_id').value,
          adsterra_url: document.getElementById('adsterra_url').value,
          changelog: document.getElementById('changelog').value,
          maintenance_mode: document.getElementById('maintenance_mode').checked,
          updated_at: new Date().toISOString()
        };

        const { error } = await supabase.from('app_config').update(payload).eq('id', 1);
        if (error) throw error;
        showToast('App config & APK release published successfully! (Older builds deleted)');
      } catch (err) {
        showToast(`Save failed: ${err.message}`, 'error');
        statusEl.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    };

    loadConfig();
  </script>
</body>
</html>
