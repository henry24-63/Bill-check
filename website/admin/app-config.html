<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>App Update & Maintenance - Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="main-content">
    <div class="content-body">
      <h1 style="margin-bottom: 25px;">🚀 App Update & Maintenance Control</h1>

      <div class="card">
        <form id="config-form">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
            <div class="form-group">
              <label>Latest Version Code (int)</label>
              <input type="number" id="latest_version_code" required>
            </div>
            <div class="form-group">
              <label>Latest Version Name</label>
              <input type="text" id="latest_version_name" required>
            </div>
            <div class="form-group">
              <label>Min Version Code (force update below)</label>
              <input type="number" id="min_version_code" required>
            </div>
            <div class="form-group">
              <label>APK Size (MB)</label>
              <input type="number" step="0.1" id="apk_size_mb">
            </div>
          </div>

          <div class="form-group">
            <label>APK File Upload (or paste external URL below)</label>
            <input type="file" id="apk-file-input" accept=".apk" style="margin-bottom: 10px;">
            <div id="upload-progress" style="display: none; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 10px; overflow: hidden;">
              <div id="progress-bar" style="width: 0%; height: 100%; background: var(--primary);"></div>
            </div>
            <label>APK URL</label>
            <input type="url" id="apk_url" placeholder="https://..." required>
          </div>

          <div class="form-group">
            <label>Changelog</label>
            <textarea id="changelog" rows="4"></textarea>
          </div>

          <div class="form-group">
            <label>Force Update Message</label>
            <input type="text" id="force_update_message">
          </div>

          <div style="display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="maintenance_mode" style="width: auto;"> Enable Maintenance Mode
            </label>
          </div>

          <div class="form-group">
            <label>Maintenance Message</label>
            <input type="text" id="maintenance_message">
          </div>

          <div style="display: flex; gap: 15px; margin-top: 25px;">
            <button type="submit" class="btn">Save App Config</button>
            <button type="button" id="force-update-btn" class="btn btn-outline">⚡ Trigger Force Update (Set Min = Latest)</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { initAuthGuard } from './js/auth-guard.js';
    import { initAdminNav } from './js/admin-nav.js';
    import { supabase } from '../js/supabase.js';
    import { showToast, showConfirm } from './js/toast.js';

    await initAuthGuard();
    initAdminNav('app-config');

    const form = document.getElementById('config-form');

    async function loadConfig() {
      const { data, error } = await supabase.from('app_config').select('*').eq('id', 1).maybeSingle();
      if (error || !data) return;

      document.getElementById('latest_version_code').value = data.latest_version_code;
      document.getElementById('latest_version_name').value = data.latest_version_name;
      document.getElementById('min_version_code').value = data.min_version_code;
      document.getElementById('apk_size_mb').value = data.apk_size_mb;
      document.getElementById('apk_url').value = data.apk_url;
      document.getElementById('changelog').value = data.changelog;
      document.getElementById('force_update_message').value = data.force_update_message;
      document.getElementById('maintenance_mode').checked = data.maintenance_mode;
      document.getElementById('maintenance_message').value = data.maintenance_message;
    }

    // APK file upload with progress bar simulation
    const fileInput = document.getElementById('apk-file-input');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('upload-progress');

    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      progressContainer.style.display = 'block';
      progressBar.style.width = '30%';

      const fileName = `app_${Date.now()}.apk`;
      const { data, error } = await supabase.storage.from('apk').upload(fileName, file);

      if (error) {
        showToast(`Upload failed: ${error.message}`, 'error');
        progressContainer.style.display = 'none';
        return;
      }

      progressBar.style.width = '100%';
      const { data: { publicUrl } } = supabase.storage.from('apk').getPublicUrl(fileName);
      document.getElementById('apk_url').value = publicUrl;
      document.getElementById('apk_size_mb').value = (file.size / (1024 * 1024)).toFixed(1);
      showToast('APK uploaded successfully!');
      setTimeout(() => progressContainer.style.display = 'none', 1000);
    };

    document.getElementById('force-update-btn').onclick = () => {
      showConfirm('Are you sure you want to force update all users by setting min version code equal to latest version code?', () => {
        document.getElementById('min_version_code').value = document.getElementById('latest_version_code').value;
        showToast('Min version code updated to latest. Click Save App Config to publish.');
      });
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        latest_version_code: Number(document.getElementById('latest_version_code').value),
        latest_version_name: document.getElementById('latest_version_name').value,
        min_version_code: Number(document.getElementById('min_version_code').value),
        apk_size_mb: Number(document.getElementById('apk_size_mb').value),
        apk_url: document.getElementById('apk_url').value,
        changelog: document.getElementById('changelog').value,
        force_update_message: document.getElementById('force_update_message').value,
        maintenance_mode: document.getElementById('maintenance_mode').checked,
        maintenance_message: document.getElementById('maintenance_message').value,
        updated_at: new Date().toISOString()
      };

      if (payload.latest_version_code < payload.min_version_code) {
        showToast('Latest version code cannot be less than min version code.', 'error');
        return;
      }

      try {
        const { error } = await supabase.from('app_config').update(payload).eq('id', 1);
        if (error) throw error;
        showToast('App config saved successfully! (Published)');
      } catch (err) {
        showToast(`Save failed: ${err.message}`, 'error');
      }
    };

    loadConfig();
  </script>
</body>
</html>
