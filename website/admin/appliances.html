<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Appliances - Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="main-content">
    <div class="content-body" id="crud-container"></div>
  </div>

  <script type="module">
    import { initAuthGuard } from './js/auth-guard.js';
    import { initAdminNav } from './js/admin-nav.js';
    import { initCrud } from './js/crud-component.js';

    await initAuthGuard();
    initAdminNav('appliances');

    initCrud('crud-container', {
      tableName: 'appliances',
      title: 'Appliances (Calculator)',
      columns: [
        { key: 'name_en', label: 'Name (EN)', required: true },
        { key: 'name_ur', label: 'Name (UR)' },
        { key: 'default_watts', label: 'Default Watts', type: 'number', required: true },
        { key: 'icon', label: 'Icon Name' },
        { key: 'sort_order', label: 'Sort Order', type: 'number' },
        { key: 'is_active', label: 'Active', type: 'boolean' }
      ],
      defaultValues: { default_watts: 100, sort_order: 0, is_active: true }
    });
  </script>
</body>
</html>
